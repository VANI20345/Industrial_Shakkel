name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pause
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d ' \r\n"' | tr -d "'")
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d ' \r\n"' | tr -d "'")
          curl -sf "${CLEAN_URL}/rest/v1/cities?select=id&limit=1" \
          -H "apikey: ${CLEAN_KEY}" \
          -H "Authorization: Bearer ${CLEAN_KEY}"
